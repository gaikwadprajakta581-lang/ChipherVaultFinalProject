<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Hybrid Encrypted Cloud Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/vault-theme.css') }}">
</head>
<body class="auth-body">
  <div class="auth-glow"></div>

  <div class="auth-panel">
    <div class="brand" style="padding-bottom:22px;">
      <div class="brand-mark">&#128274;</div>
      <div class="brand-name">CipherVault</div>
    </div>

    <h2>Set a new password</h2>
    <p class="sub">Choose a strong password you haven't used before.</p>

    {% if error %}
      <div class="msg-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>New password</label>
        <input type="password" name="password" placeholder="At least 6 characters" required>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" name="confirm_password" placeholder="Re-enter password" required>
      </div>
      <button type="submit" class="btn-submit">Reset password</button>
    </form>

    <div class="auth-vault-chip">&#128274; AES-256 · RSA-2048</div>
  </div>
</body>
</html>
