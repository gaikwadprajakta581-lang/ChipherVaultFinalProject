<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change Password | CipherVault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/vault-theme.css') }}">
</head><body class="auth-body">
<div class="auth-panel">
<h2>Change Password</h2>
{% if error %}<div class="msg-error">{{ error }}</div>{% endif %}
{% if success %}<div class="msg-success">{{ success }}</div>{% endif %}
<form method="POST">
<div class="field"><label>Current password</label><input type="password" name="current_password" required></div>
<div class="field"><label>New password</label><input type="password" name="new_password" minlength="6" required></div>
<div class="field"><label>Confirm new password</label><input type="password" name="confirm_password" minlength="6" required></div>
<button class="btn-submit" type="submit">Change Password</button>
</form>
<div class="foot-link"><a href="/profile">Back to Profile</a></div>
</div></body></html>
