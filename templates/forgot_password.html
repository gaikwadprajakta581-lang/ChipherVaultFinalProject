<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Hybrid Encrypted Cloud Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/vault-theme.css') }}">
</head>
<body class="auth-body">
  <div class="auth-glow"></div>

  <div class="auth-panel">
    <div class="brand" style="padding-bottom:22px;">
      <div class="brand-mark">&#128274;</div>
      <div class="brand-name">CipherVault</div>
    </div>

    <h2>Forgot your password?</h2>
    <p class="sub">Enter your registered email to generate a secure reset link.</p>

    {% if message %}
      <div class="msg-success">{{ message }}</div>
    {% endif %}
    {% if reset_link %}
      <div class="msg-success" style="margin-top:12px;">
        Demo reset link:
        <a href="{{ reset_link }}" style="color:inherit;font-weight:700;">Open password reset</a>
      </div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn-submit">Send reset link</button>
    </form>

    <div class="foot-link">Remembered it? <a href="/login">Back to login</a></div>

    <div class="auth-vault-chip">&#128274; AES-256 · RSA-2048</div>
  </div>
</body>
</html>
