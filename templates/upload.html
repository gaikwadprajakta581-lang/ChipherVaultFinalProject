<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload | CipherVault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/vault-theme.css') }}">
</head><body class="auth-body">
<div class="auth-panel">
<h2>Upload Secure File</h2>
{% if error %}<div class="msg-error">{{ error }}</div>{% endif %}
<form method="POST" action="/upload" enctype="multipart/form-data">
<div class="field"><label>Select file</label><input type="file" name="file" required></div>
<button class="btn-submit" type="submit">Upload & Encrypt</button>
</form>
<div class="foot-link"><a href="/dashboard">Back to Dashboard</a></div>
</div></body></html>
